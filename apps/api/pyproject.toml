[project]
name = "wormgpt-api"
version = "0.1.0"
description = "worm-ai FastAPI backend — © 3MH Technologies | https://3mh.pages.dev | t.me/j49_c"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "motor>=3.5.0",
  "redis>=5.0.0",
  "PyJWT>=2.8.0",
  "bcrypt>=4.0.0",
  "cryptography>=42.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "tenacity>=8.3.0",
  "structlog>=24.1.0",
  "email-validator>=2.1.0",
  "sse-starlette>=2.1.0",
  "beautifulsoup4>=4.12.0",
  "bleach>=6.1.0",
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "PL"]
# PLC0415: lazy in-function imports are intentional (defer heavy/optional deps).
# PLW0603: module-level singletons (mongo/redis/fernet clients) are the pattern here.
ignore = ["PLR0913", "PLR2004", "E501", "PLC0415", "PLW0603"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `x = Depends(...)`, `f = File(...)` in signatures.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.UploadFile",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Body",
]

# Long streaming/agent handlers kept as-is (statement/branch limits per file).
[tool.ruff.lint.per-file-ignores]
"app/api/v1/admin.py" = ["PLR0917"]
"app/api/v1/agent.py" = ["PLR0911", "PLR0912", "PLR0915"]
"app/api/v1/chat.py" = ["PLR0912", "PLR0915", "PLR0917"]
"app/api/v1/search.py" = ["PLR0912"]
"app/services/deepseek.py" = ["PLR0912", "PLR0915"]
"app/services/notrack.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]
